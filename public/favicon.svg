<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#312e81" stroke-width="8" />

  <!-- Shield / Crest Shape -->
  <path d="M256 70 L390 125 C390 280 256 420 256 420 C256 420 122 280 122 125 Z" fill="#1e1b4b" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Crossed Swords / Clash Stylized Geometry -->
  <!-- Left Sword Blade -->
  <path d="M190 160 L320 320 L305 335 L175 175 Z" fill="url(#goldGrad)" />
  <path d="M330 330 L350 350 L340 360 L320 340 Z" fill="#fbbf24" />
  <circle cx="355" cy="365" r="8" fill="#f59e0b" />

  <!-- Right Sword Blade -->
  <path d="M322 160 L192 320 L207 335 L337 175 Z" fill="url(#goldGrad)" />
  <path d="M182 330 L162 350 L172 360 L192 340 Z" fill="#fbbf24" />
  <circle cx="157" cy="365" r="8" fill="#f59e0b" />

  <!-- Central Flame / Wisdom Spark -->
  <path d="M256 180 C275 220 300 245 285 285 C275 315 240 325 240 325 C240 325 260 295 245 270 C235 250 240 220 256 180 Z" fill="url(#flameGrad)" />

  <!-- Letter V / Apex Highlight -->
  <text x="256" y="270" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="#ffffff" text-anchor="middle" dominant-baseline="central" filter="url(#glow)">V</text>

  <!-- Crown / Star at Top -->
  <polygon points="256,100 263,115 279,117 267,128 270,144 256,136 242,144 245,128 233,117 249,115" fill="#fef08a" />
</svg>
