<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="85%" stop-color="#090a1a" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>

    <!-- Lightning & Energy Gradients -->
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Blue Glove Gradient -->
    <radialGradient id="blueGlove" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <linearGradient id="blueWrist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Purple Glove Gradient -->
    <radialGradient id="purpleGlove" cx="65%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f0abfc" />
      <stop offset="25%" stop-color="#c084fc" />
      <stop offset="65%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </radialGradient>
    <linearGradient id="purpleWrist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <!-- Gold Ribbon & Text Gradients -->
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="vocabTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="85%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="clashTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Book Pages Gradient -->
    <linearGradient id="bookPages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Tile Blue Gradient -->
    <linearGradient id="tileBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <!-- Tile Purple Gradient -->
    <linearGradient id="tilePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" stroke="#3b0764" stroke-width="4" />

  <!-- Background Ambient Elements -->
  <!-- Top Left Ghost Book Icon -->
  <g opacity="0.25" transform="translate(60, 45) scale(0.65)">
    <path d="M40 20 C60 10 90 10 110 25 C130 10 160 10 180 20 L180 110 C160 98 130 98 110 115 C90 98 60 98 40 110 Z" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="60" y1="45" x2="95" y2="40" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <line x1="60" y1="65" x2="95" y2="60" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <line x1="60" y1="85" x2="95" y2="80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Top Right Ghost Trophy Icon -->
  <g opacity="0.3" transform="translate(370, 50) scale(0.65)">
    <path d="M30 20 L110 20 C110 65 85 85 70 90 L70 120 L100 135 L40 135 L70 120 L70 90 C55 85 30 65 30 20 Z" fill="none" stroke="#e879f9" stroke-width="12" stroke-linejoin="round" />
    <path d="M30 35 C15 35 10 50 15 65 C20 75 30 75 35 70" fill="none" stroke="#e879f9" stroke-width="10" stroke-linecap="round" />
    <path d="M110 35 C125 35 130 50 125 65 C120 75 110 75 105 70" fill="none" stroke="#e879f9" stroke-width="10" stroke-linecap="round" />
    <polygon points="70,40 73,50 84,50 75,57 78,67 70,61 62,67 65,57 56,50 67,50" fill="#e879f9" />
  </g>

  <!-- Left Floating 'W' Tile -->
  <g transform="translate(35, 175) rotate(-14) scale(0.9)" filter="url(#dropShadow)">
    <rect width="64" height="64" rx="14" fill="url(#tileBlue)" stroke="#7dd3fc" stroke-width="3" />
    <text x="32" y="44" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle">W</text>
  </g>

  <!-- Right Floating '?' Tile -->
  <g transform="translate(415, 200) rotate(16) scale(0.9)" filter="url(#dropShadow)">
    <rect width="64" height="64" rx="14" fill="url(#tilePurple)" stroke="#f0abfc" stroke-width="3" />
    <text x="32" y="46" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">?</text>
  </g>

  <!-- Confetti / Geometric Particles -->
  <polygon points="90,140 102,150 90,158" fill="#facc15" opacity="0.85" />
  <polygon points="430,135 442,125 435,145" fill="#f43f5e" opacity="0.85" />
  <polygon points="465,160 480,170 468,178" fill="#a855f7" opacity="0.8" />
  <polygon points="50,265 65,275 52,282" fill="#38bdf8" opacity="0.8" />

  <!-- Center Lightning Energy Flash Burst Behind Gloves -->
  <g filter="url(#glowEffect)">
    <!-- Shockwave Flash -->
    <circle cx="256" cy="165" r="50" fill="#ffffff" opacity="0.4" />
    <!-- Lightning Bolt Center Clashing -->
    <polygon points="262,40 270,120 286,125 252,185 260,195 240,240 252,175 238,170" fill="url(#lightningGrad)" />
    <!-- Sparks -->
    <polygon points="230,105 245,130 236,132" fill="#fef08a" />
    <polygon points="280,110 295,95 285,120" fill="#fef08a" />
    <polygon points="265,200 280,215 268,220" fill="#fef08a" />
  </g>

  <!-- Left Boxing Glove (Cyan/Blue) with Letter 'A' -->
  <g transform="translate(110, 100) rotate(16)" filter="url(#dropShadow)">
    <!-- Wrist Band -->
    <rect x="15" y="105" width="45" height="24" rx="8" fill="url(#blueWrist)" stroke="#0284c7" stroke-width="3" />
    <line x1="28" y1="105" x2="28" y2="129" stroke="#38bdf8" stroke-width="2" />
    <line x1="42" y1="105" x2="42" y2="129" stroke="#38bdf8" stroke-width="2" />
    <!-- Glove Main Body -->
    <path d="M40 30 C75 10 120 30 125 75 C130 110 100 125 65 115 C45 110 25 90 25 65 C25 45 30 35 40 30 Z" fill="url(#blueGlove)" stroke="#0c4a6e" stroke-width="6" />
    <!-- Thumb Curve -->
    <path d="M95 85 C115 88 125 105 110 120 C95 125 80 115 80 100 Z" fill="url(#blueGlove)" stroke="#0c4a6e" stroke-width="5" />
    <!-- Glove Highlight Sheen -->
    <path d="M45 35 C65 25 95 35 100 55" fill="none" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round" />
    <!-- Letter 'A' on Blue Glove -->
    <text x="75" y="82" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" filter="url(#dropShadow)">A</text>
  </g>

  <!-- Right Boxing Glove (Purple/Magenta) with Letter 'Z' -->
  <g transform="translate(255, 100) rotate(-16)" filter="url(#dropShadow)">
    <!-- Wrist Band -->
    <rect x="85" y="105" width="45" height="24" rx="8" fill="url(#purpleWrist)" stroke="#7e22ce" stroke-width="3" />
    <line x1="98" y1="105" x2="98" y2="129" stroke="#c084fc" stroke-width="2" />
    <line x1="112" y1="105" x2="112" y2="129" stroke="#c084fc" stroke-width="2" />
    <!-- Glove Main Body -->
    <path d="M105 30 C70 10 25 30 20 75 C15 110 45 125 80 115 C100 110 120 90 120 65 C120 45 115 35 105 30 Z" fill="url(#purpleGlove)" stroke="#3b0764" stroke-width="6" />
    <!-- Thumb Curve -->
    <path d="M50 85 C30 88 20 105 35 120 C50 125 65 115 65 100 Z" fill="url(#purpleGlove)" stroke="#3b0764" stroke-width="5" />
    <!-- Glove Highlight Sheen -->
    <path d="M100 35 C80 25 50 35 45 55" fill="none" stroke="#fdf4ff" stroke-width="5" stroke-linecap="round" />
    <!-- Letter 'Z' on Purple Glove -->
    <text x="70" y="82" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" filter="url(#dropShadow)">Z</text>
  </g>

  <!-- Open Radiant Book at Bottom Center -->
  <g transform="translate(70, 235)" filter="url(#dropShadow)">
    <!-- Book Outer Cover & Spine -->
    <path d="M186 95 C110 65 20 85 5 95 L15 125 C45 112 120 95 186 118 C252 95 327 112 357 125 L367 95 C352 85 262 65 186 95 Z" fill="#0f172a" stroke="#1e293b" stroke-width="4" />
    <!-- Left Fan Pages -->
    <path d="M186 85 C125 50 45 68 18 80 L22 105 C55 92 125 75 186 102 Z" fill="#c7d2fe" />
    <path d="M186 75 C125 40 50 58 25 70 L30 92 C62 80 130 65 186 90 Z" fill="#e0e7ff" />
    <path d="M186 65 C130 30 60 48 38 60 L45 80 C75 68 135 55 186 80 Z" fill="url(#bookPages)" stroke="#93c5fd" stroke-width="1.5" />
    <!-- Right Fan Pages -->
    <path d="M186 85 C247 50 327 68 354 80 L350 105 C317 92 247 75 186 102 Z" fill="#c7d2fe" />
    <path d="M186 75 C247 40 322 58 347 70 L342 92 C310 80 242 65 186 90 Z" fill="#e0e7ff" />
    <path d="M186 65 C242 30 312 48 334 60 L327 80 C297 68 237 55 186 80 Z" fill="url(#bookPages)" stroke="#93c5fd" stroke-width="1.5" />
    <!-- Spine Center Glow -->
    <polygon points="183,65 189,65 189,105 183,105" fill="#38bdf8" />
  </g>

  <!-- Big 3D "VocabClash" Typography -->
  <g transform="translate(256, 385)" filter="url(#dropShadow)">
    <!-- Deep Dark 3D Extrusion Layer -->
    <text x="0" y="10" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="76" text-anchor="middle" letter-spacing="-2" fill="#030712" stroke="#030712" stroke-width="16" stroke-linejoin="round">VocabClash</text>
    <text x="0" y="6" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="76" text-anchor="middle" letter-spacing="-2" fill="#090d16" stroke="#090d16" stroke-width="10" stroke-linejoin="round">VocabClash</text>

    <!-- Foreground Stylized Vocab (White) + Clash (Gold/Yellow) -->
    <text x="-76" y="0" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="76" text-anchor="middle" letter-spacing="-2" fill="url(#vocabTextGrad)" stroke="#090d16" stroke-width="4">Vocab</text>
    <text x="88" y="0" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="76" text-anchor="middle" letter-spacing="-2" fill="url(#clashTextGrad)" stroke="#090d16" stroke-width="4">Clash</text>
  </g>

  <!-- Bottom Gold Banner: LEARN • PLAY • DOMINATE -->
  <g transform="translate(86, 420)" filter="url(#dropShadow)">
    <!-- Banner Dark Body with Gold Border -->
    <path d="M20 0 L320 0 L340 38 L320 38 L20 38 L0 38 Z" fill="#0f172a" stroke="url(#goldBanner)" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="0,38 16,19 0,0 20,0 20,38" fill="url(#goldBanner)" />
    <polygon points="340,38 324,19 340,0 320,0 320,38" fill="url(#goldBanner)" />
    <!-- Banner Subtext -->
    <text x="170" y="26" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="16" letter-spacing="2.5" fill="#ffffff" text-anchor="middle">LEARN  •  PLAY  •  DOMINATE</text>
  </g>
</svg>
